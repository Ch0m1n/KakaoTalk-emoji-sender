name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python tools/prepare-build.py
      - shell: pwsh
        run: ./build.ps1
      - shell: pwsh
        run: |
          ./tools/test-build.ps1 -Flags @('--hover-animation-test','--thumbnail-memory-test','--thumbnail-cache-test','--scroll-repaint-test','--arca-search-test','--app-update-test','--longcon-test','--ui-zoom-test','--release-self-check','--copy-refresh-test')
          ./tools/test-update.ps1
          ./tools/test-updater-handoff.ps1
      - run: python tools/package-release.py
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content version.json -Raw | ConvertFrom-Json).version
          if($env:GITHUB_REF_NAME -cne "v$version"){throw 'Tag and package version must match.'}
          gh release create $env:GITHUB_REF_NAME "releases/$version/AgitCon-win-x64.zip" "releases/$version/AgitCon-win-x64.zip.sha256" --verify-tag --title "AgitCon $version" --generate-notes
      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:exe /platform:x64 /reference:System.dll /reference:System.Core.dll /reference:System.Runtime.Serialization.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll "/out:$(Join-Path $PWD 'artifacts/tests/VerifyPublishedUpdate.exe')" (Join-Path $PWD 'src/AppUpdateCore.cs') (Join-Path $PWD 'tools/VerifyPublishedUpdate.cs')
          if($LASTEXITCODE){throw 'Release check compilation failed'}
          & ./artifacts/tests/VerifyPublishedUpdate.exe (Join-Path $PWD 'artifacts/tests/public-release')
          if($LASTEXITCODE){throw 'Published update validation failed'}
